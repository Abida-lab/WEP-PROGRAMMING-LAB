<html>
<head>
<title>Registration Form</title>
</head>
<body>
<h1>Registration - Form Validation</h1>
<form name="form" action=" " onsubmit="return validateForm()">
<label for="name">Name :</label>
<select>
<option value="MR">Mr.</option>
<option value="MRS">Mrs.</option>
</select>
<input type="text" id="fname" name="fname" placeholder="Enter your Name"><br><br>
<label for="phone">Phone : </label>
<select name="code" id="code">
<option value="+91">+91</option>
<option value="+971">+971</option>
</select>
<input type="tel" id="mob" name="mob" placeholder="Enter Mobile Number"><br><br>
<label for="email">Email : </label>
<input type="email" id="email" name="email" placeholder="Enter Email"><br><br>
<label for="password">password : </label>
<input type="password" id="password" name="password" placeholder="Enter your Password"><br><br>
<label for="confirm password">Confirm password : </label>
<input type="password" id="confirmpassword" name="confirmpassword" placeholder="Enter your Password"><br><br>
<label for="gender">Gender : </label>
<input type="radio"name="gender"><label>Male</label>
<input type="radio"name="gender"><label>Female</label>
<input type="radio"name="gender"><label>Other</label><br><br>
<label for="Languages known">Languages known : </label>
<input type="checkbox"name="malayalam"><label>Malayalam</label>
<input type="checkbox"name="english"><label>English</label>
<input type="checkbox"name="hindi"><label>Hindi</label><br><br>
<button type="submit">Submit</button>
</form>
<script>
function validateForm() {
var fname = document.form.fname.value.trim();
var mob = document.form.mob.value.trim();
var email = document.form.email.value.trim();
var password = document.form.password.value;
var confirmPassword = document.form.confirmpassword.value;
if(fname == ""){
alert("Enter your Name");
document.form.fname.focus();
return false;
}
else if(!/^[a-zA-Z]+$/.test(fname)){
alert("Enter valid Name");
document.form.fname.focus();
return false;
}
if(mob == ""){
alert("Enter your Mobile Number");
document.form.mob.focus();
return false;
}
else if(!/^[0-9]{10}$/.test(mob)){
alert("Enter a valid 10 digit Mobile Number");
document.form.mob.focus();
return false;
}
if(email == ""){
alert("Enter your Email Id");
document.form.email.focus();
return false;
}
else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
alert("Enter valid email");
document.form.email.focus();
return false;
}
if(password == ""){
alert("Enter your Password");
document.form.password.focus();
return false;
}
else if(password.length < 8){
alert("Password must contain at least 8 characters");
document.form.password.focus();
return false;
}
if(confirmPassword == ""){
alert("Enter your Confirm Password");
document.form.confirmpassword.focus();
return false;
}
else if(password != confirmPassword){
alert("Password and Confirm Password do not match");
document.form.confirmpassword.focus();
return false;
}
alert("Form submitted Successfully");
return true;
}
</script>
</body>
</html>
